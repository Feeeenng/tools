- name: Set root password (for first time)
  mysql_user:
    name: root
    host_all: true
    password: "{{ slurm_db_pass }}"
    login_unix_socket: /var/lib/mysql/mysql.sock
  ignore_errors: yes
  when:
    - inventory_hostname == groups['slurm_controller'][0]

- name: Create database
  mysql_db:
    name: "{{ slurm_db_name }}"
    state: present
    login_user: root
    login_password: "{{ slurm_db_pass }}"
  when:
    - inventory_hostname == groups['slurm_controller'][0]


- name: Create slurm database user
  mysql_user:
    name: "{{ slurm_db_user }}"
    host: localhost
    password: "{{ slurm_db_pass }}"
    priv: "*.*:ALL"
    state: present
    login_user: root
    login_password: "{{ slurm_db_pass }}"
  when: 
    - inventory_hostname == groups['slurm_controller'][0]