- name: Install required packages (RedHat)
  yum:
    name: 
      - mariadb-server
      - MySQL-python
      # - python3-pymysql
    state: present
  when: 
    - ansible_facts['os_family'] == "RedHat"
    - inventory_hostname == groups['slurm_controller'][0]



- name: Deploy my.cnf configuration
  template:
    src: my.cnf.j2
    dest: /etc/my.cnf
    mode: '0644'
  notify: restart mariadb
  when:
    - inventory_hostname == groups['slurm_controller'][0]    

- name: Ensure MariaDB is started and enabled
  service:
    name: mariadb
    state: started
    enabled: yes
  when: 
    - ansible_facts['os_family'] == "RedHat"
    - inventory_hostname == groups['slurm_controller'][0]

